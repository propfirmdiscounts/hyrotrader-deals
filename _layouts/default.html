<!DOCTYPE html>
<html lang="{{ page.lang | default: site.lang | default: "en-US" }}">
  <head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ page.title | default: site.title }}</title>
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-JRN9LT8NNF"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());

      gtag('config', 'G-JRN9LT8NNF');
    </script>
    <!-- Favicon -->
    <link rel="shortcut icon" type="image/x-icon" href="https://propfirmdiscounts.github.io/favicon.ico">
    <link rel="icon" type="image/png" sizes="32x32" href="https://propfirmdiscounts.github.io/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="https://propfirmdiscounts.github.io/favicon-16x16.png">
    <link rel="apple-touch-icon" sizes="180x180" href="https://propfirmdiscounts.github.io/apple-touch-icon.png">
    <link rel="manifest" href="https://propfirmdiscounts.github.io/site.webmanifest">
    {% seo title=false %}
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "BreadcrumbList",
      "itemListElement": [
        {
          "@type": "ListItem",
          "position": 1,
          "name": "Home",
          "item": "https://propfirmdiscounts.github.io/"
        },
        {
          "@type": "ListItem",
          "position": 2,
          "name": "All Prop Firms & Events",
          "item": "https://propfirmdiscounts.github.io/prop-firm-discount-codes/"
        },
        {
          "@type": "ListItem",
          "position": 3,
          "name": {{ page.title | default: site.title | jsonify }},
          "item": "https://propfirmdiscounts.github.io/hyrotrader-deals/"
        }
      ]
    }
    </script>
    <script type="application/ld+json">
{
    "@context": "https://schema.org",
    "@type": "FAQPage",
    "mainEntity": [
        {
            "@type": "Question",
            "name": "What is the HyroTrader discount code?",
            "acceptedAnswer": {
                "@type": "Answer",
                "text": "PFD. It is verified by PropFirmDiscount.com and takes 5% off HyroTrader challenges and accounts."
            }
        },
        {
            "@type": "Question",
            "name": "Does the HyroTrader discount code expire?",
            "acceptedAnswer": {
                "@type": "Answer",
                "text": "No. It is a standing code — there is no start date and no end date. Promotional deals are separate and are dated individually; the current one is listed above."
            }
        },
        {
            "@type": "Question",
            "name": "How much is the current HyroTrader deal?",
            "acceptedAnswer": {
                "@type": "Answer",
                "text": "Hyro Instant Launch 15% Off First 30 — published 2026-11-06. Offer ends: Limited time. The offer is 15% off."
            }
        }
    ]
}
    </script>
    <script type="application/ld+json">
{
    "@context": "https://schema.org",
    "@type": "Dataset",
    "name": "HyroTrader Discount Codes & Deal History Dataset",
    "description": "As of November 2026, the verified HyroTrader discount code is PFD — 5% OFF, which can be applied on the checkout page anytime. The newest is \\",
    "url": "https://propfirmdiscounts.github.io/hyrotrader-deals/",
    "sameAs": "https://propfirmdiscount.com/prop-firm/hyrotrader/",
    "license": "https://propfirmdiscount.com",
    "creator": {
        "@type": "Organization",
        "name": "PropFirmDiscount",
        "url": "https://propfirmdiscount.com"
    },
    "distribution": [
        {
            "@type": "DataDownload",
            "encodingFormat": "application/json",
            "contentUrl": "https://raw.githubusercontent.com/propfirmdiscounts/hyrotrader-deals/main/datasets/hyrotrader-deals.json"
        }
    ],
    "temporalCoverage": "2024/2026",
    "variableMeasured": [
        "deal_id",
        "title",
        "discount_value",
        "standing_code",
        "standing_discount",
        "date_published",
        "date_exp",
        "post_url"
    ]
}
    </script>
    <link rel="stylesheet" href="{{ "/assets/css/style.css?v=" | append: site.github.build_revision | relative_url }}">
    {% include head-custom.html %}
  </head>
  <body>
    <div class="container-lg px-3 my-5 markdown-body">
      <nav aria-label="Breadcrumb" style="font-size: 0.9em; margin-bottom: 1.5rem; color: #57606a;">
        <a href="https://propfirmdiscounts.github.io/">Home</a> &rsaquo;
        <a href="https://propfirmdiscounts.github.io/prop-firm-discount-codes/">All Prop Firms &amp; Events</a> &rsaquo;
        <span style="color: #24292f; font-weight: 500;">{{ page.firm_name | default: page.title | default: site.title }}</span>
      </nav>
      {{ content }}
    </div>
  </body>
</html>
